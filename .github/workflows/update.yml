name: 買取率ランキング更新

on:
  schedule:
    - cron: "0 2 * * *"  # 毎日 11:00 JST（UTC 2:00）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 買取価格を取得
        run: python -I scripts/scrape_ichiban.py data/ichiban.json
      - name: ランキングを作成
        run: python -I scripts/build.py data/ichiban.json data/amazon_prices.json scripts/template.html docs/index.html docs/ranking.csv --standalone
      - name: 結果をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/ichiban.json
          git commit -m "買取価格を更新 $(TZ=Asia/Tokyo date +%F)" || echo "変更なし"
          git push
